<!doctype html>
<html lang="en" class="is-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d4c444" />
    <title>FBX Viewer</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main id="viewer" aria-label="Interactive 3D model viewer">
      <canvas id="nebula" aria-hidden="true"></canvas>
      <canvas id="starfield" aria-hidden="true"></canvas>
      <div id="name-backdrop" aria-hidden="true"><span class="name-word">Zhan</span><span class="name-word">Feng</span></div>
      <div id="canvas-host"></div>
      <section id="portfolio" aria-label="Portfolio">
        <div class="portfolio-navigation">
        <div class="portfolio-tabs" role="tablist" aria-label="Portfolio sections">
          <button id="projects-tab" class="portfolio-tab" type="button" role="tab" aria-selected="true" aria-controls="projects-panel">Projects</button>
          <span class="tab-divider" aria-hidden="true"></span>
          <button id="devlog-tab" class="portfolio-tab" type="button" role="tab" aria-selected="false" aria-controls="devlog-panel" tabindex="-1">Devlogs</button>
        </div>
        <div class="portfolio-divider" aria-hidden="true"></div>
        </div>
        <section id="projects-panel" class="portfolio-panel" role="tabpanel" aria-labelledby="projects-tab" tabindex="0"><div id="project-list" class="project-list"></div></section>
        <section id="devlog-panel" class="portfolio-panel" role="tabpanel" aria-labelledby="devlog-tab" tabindex="0" hidden></section>
      </section>
      <section id="purple-section" aria-label="Project image gallery">
        <h2 id="section-scroll-title" aria-label="Achievements and Gallery"><span></span><span class="section-title-caret" aria-hidden="true">|</span></h2>
        <div class="section-gallery-stage">
        <div class="section-gallery" id="achievements-gallery">
          <figure style="--image-width: 62%; --image-offset: 30%;">
            <figcaption>Ahma's Stray search — character artwork</figcaption>
            <img src="./assets/ahma-thumbnail-16x9.png" alt="Illustrated cat characters from Ahma's Stray search" loading="lazy" />
          </figure>
          <figure style="--image-width: 86%; --image-offset: 3%;">
            <figcaption>Surface Tension — start screen</figcaption>
            <img src="./assets/surfaceTension-thumbnail.png" alt="Surface Tension start screen" loading="lazy" />
          </figure>
          <figure style="--image-width: 48%; --image-offset: 45%;">
            <figcaption>Souls Like — project preview</figcaption>
            <img src="./assets/SoulsLike.png" alt="Souls Like project screenshot" loading="lazy" />
          </figure>
          <figure style="--image-width: 74%; --image-offset: 12%;">
            <figcaption>HLSL shaders — post processing</figcaption>
            <img src="./assets/PostProcessing.png" alt="HLSL shaders and post processing screenshot" loading="lazy" />
          </figure>
          <figure style="--image-width: 55%; --image-offset: 2%;">
            <figcaption>Horror Game — 3D OpenGL</figcaption>
            <img src="./assets/HorrorOpenGL.png" alt="Horror Game in 3D OpenGL screenshot" loading="lazy" />
          </figure>
          <figure style="--image-width: 90%; --image-offset: 8%;">
            <figcaption>Game Physics — Unity</figcaption>
            <img src="./assets/GamePhysicsUnity.png" alt="Game Physics In Unity screenshot" loading="lazy" />
          </figure>
          <figure style="--image-width: 64%; --image-offset: 28%;">
            <figcaption>First Person Shooter — prototype</figcaption>
            <img src="./assets/Fpsshooter.png" alt="First Person Shooter Prototype screenshot" loading="lazy" />
          </figure>
        </div>
        <div class="section-gallery" id="photo-gallery">
          <figure style="--image-width: 78%; --image-offset: 16%;">
            <figcaption>Ahma's Stray search — character artwork</figcaption>
            <img src="./assets/ahma-thumbnail-16x9.png" alt="Illustrated cat characters from Ahma's Stray search" loading="lazy" />
          </figure>
          <figure style="--image-width: 52%; --image-offset: 4%;">
            <figcaption>Surface Tension — start screen</figcaption>
            <img src="./assets/surfaceTension-thumbnail.png" alt="Surface Tension start screen" loading="lazy" />
          </figure>
          <figure style="--image-width: 88%; --image-offset: 10%;">
            <figcaption>Souls Like — project preview</figcaption>
            <img src="./assets/SoulsLike.png" alt="Souls Like project screenshot" loading="lazy" />
          </figure>
          <figure style="--image-width: 60%; --image-offset: 35%;">
            <figcaption>HLSL shaders — post processing</figcaption>
            <img src="./assets/PostProcessing.png" alt="HLSL shaders and post processing screenshot" loading="lazy" />
          </figure>
          <figure style="--image-width: 72%; --image-offset: 2%;">
            <figcaption>Horror Game — 3D OpenGL</figcaption>
            <img src="./assets/HorrorOpenGL.png" alt="Horror Game in 3D OpenGL screenshot" loading="lazy" />
          </figure>
          <figure style="--image-width: 46%; --image-offset: 48%;">
            <figcaption>Game Physics — Unity</figcaption>
            <img src="./assets/GamePhysicsUnity.png" alt="Game Physics In Unity screenshot" loading="lazy" />
          </figure>
          <figure style="--image-width: 82%; --image-offset: 12%;">
            <figcaption>First Person Shooter — prototype</figcaption>
            <img src="./assets/Fpsshooter.png" alt="First Person Shooter Prototype screenshot" loading="lazy" />
          </figure>
        </div>
        </div>
      </section>
      <section id="nebula-return" aria-label="Yellow nebula section"></section>
      <section id="loading-screen" role="status" aria-label="Loading 3D model">
        <svg class="loading-wave-definitions" width="0" height="0" aria-hidden="true">
          <defs>
            <clipPath id="loading-wave-clip" clipPathUnits="objectBoundingBox">
              <path id="loading-wave-path" d="M 0 0 H 1 V 1 H 0 Z" />
            </clipPath>
          </defs>
        </svg>
        <div class="loader-monogram" aria-hidden="true">
          <span class="loader-letter">
            <span class="loader-letter-base">Z</span>
            <span class="loader-monogram-fill">Z</span>
          </span>
          <span class="loader-letter">
            <span class="loader-letter-base">F</span>
            <span class="loader-monogram-fill">F</span>
          </span>
        </div>
      </section>
    </main>
  </body>
</html>
